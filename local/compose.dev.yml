name: ponylib-dev

services:
  db:
    image: postgres:12.6
    environment:
      POSTGRES_DB: ponylib
      POSTGRES_USER: ponylib
      POSTGRES_PASSWORD: ponylib-dev
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-55432}:5432"
    volumes:
      - postgres12-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponylib -d ponylib"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres12-data:
