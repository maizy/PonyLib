on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - uses: actions/cache@v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Test
      run: ./test.sh
  integrational-test:
    name: integrational test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["12", "17", "18"]
    services:
      db:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ponylib
          POSTGRES_PASSWORD: ponylib-test
          POSTGRES_DB: ponylib
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponylib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PONYLIB_TEST_DATABASE_URL: postgres://ponylib:ponylib-test@localhost:5432/ponylib?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 2m ./...
      - run: go vet ./...
